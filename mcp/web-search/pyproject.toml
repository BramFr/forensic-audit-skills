[project]
name = "forensic-web-search"
version = "1.1.0"
description = "Single-tool MCP server (search_website) for zero-trust forensic audits: DuckDuckGo search + 3-tier WAF/CMP/Playwright HTML & PDF to Markdown extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
